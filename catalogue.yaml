- name: conifure the catalogue component
  hosts: catalogue
  tasks:
  - name: disable the nodejs
    ansible.builtin.command: dnf disable the nodejs

  - name: enable the nodejs
    ansible.builtin.command: enable the nodejs

  - name: install the nodejs
    ansible.builtin.dnf: 
      state: present

  - name: create roboshop system user
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      system: true
      home: /app

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: download catalogue code
    ansible.builtin.get_url:
      url: /tmp/catalogue.zip https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip

  # this module thinks file exist on ansible control server, need to extract on remote machine    
  # remote_src: yes means file already exists in catalogue server
  - name: extract the catalogue code
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: copy catalogue service to system directory
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service

  - name: systemctl deamon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: start and enable catalogue
    ansible.builtin.service:
      name: catalogue
      state: started
      enabled: yes

  - name: copy the mongodb repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb client
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

  - name: check products loaded or not
    ansible.builtin.command: mongosh --host mongodb.daws84s.site --eval 'db.getMongo().getDBNames().indexOf("catalogue")
    register: catalogue_output

  - name: print catalogue_output
    ansible.builtin.debug:
      msg: "{{  catalogue_output  }}"

  - name: Load products
    ansible.builtin.shell: mongosh --host mongodb.daws84s.site </app/db/master-data.js &>>$LOG_FILE
    when: catalogue_output.stdout | int < 0    

  